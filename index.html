<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NHỮNG MÙA ĐI QUA - Sách Nói Tự Sự</title>
  
  <!-- Google Fonts: Inter for UI, Lora for book content -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- App Shell -->
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <button id="btn-sidebar" class="header-action-btn" aria-label="Mở danh mục">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="header-title-wrapper">
        <h1 class="book-title">NHỮNG MÙA ĐI QUA</h1>
        <p class="chapter-indicator" id="header-chapter-title">LỜI TỰA</p>
      </div>
      <button id="btn-theme" class="header-action-btn" aria-label="Đổi giao diện">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>
    
    <!-- Sidebar Navigation Drawer -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <h2>Danh mục chương</h2>
        <button id="btn-close-sidebar" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="sidebar-nav">
        <ul id="chapters-list">
          <!-- Dynamic chapters populated by JS -->
        </ul>
      </nav>
      
    </aside>
    
    <!-- Main Reading Area -->
    <main class="reading-viewport">
      <div class="reader-container">
        
        <!-- Page Indicator & Quick Nav -->
        <div class="page-nav-header">
          <button id="btn-prev-page" class="nav-arrow-btn"><i class="fa-solid fa-chevron-left"></i> Trang trước</button>
          
          <div class="header-center-group">
            <span class="page-number-badge" id="page-display">Trang ii</span>
            <div class="font-size-adjuster">
              <button id="btn-font-dec" title="Giảm cỡ chữ"><i class="fa-solid fa-minus"></i> A</button>
              <button id="btn-font-inc" title="Tăng cỡ chữ">A <i class="fa-solid fa-plus"></i></button>
            </div>
          </div>
          
          <button id="btn-next-page" class="nav-arrow-btn">Trang sau <i class="fa-solid fa-chevron-right"></i></button>
        </div>
        
        <!-- Book Content Render Box -->
        <article class="book-content" id="book-content-box">
          <!-- Dynamic paragraphs populated by JS -->
          <div class="loading-state">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Đang tải nội dung bản thảo...</p>
          </div>
        </article>
        
      </div>
    </main>
    
    <!-- Bottom Sticky Control Bar -->
    <footer class="player-controls-bar">
      
      <!-- Audio Progress Timeline -->
      <div class="progress-container">
        <span class="time-label" id="current-time">0:00</span>
        <div class="slider-wrapper">
          <div class="progress-bar-bg" id="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
        </div>
        <span class="time-label" id="duration-time">0:00</span>
      </div>
      
      <!-- Player Main Controls -->
      <div class="controls-row">
        
        <!-- Left Side: Play Speed -->
        <div class="control-group left">
          <button id="btn-speed" class="player-btn text-btn">1.0x</button>
          <!-- Speed options popover -->
          <div class="speed-menu" id="speed-menu">
            <button data-speed="0.75">0.75x</button>
            <button class="active" data-speed="1.0">1.0x (Chuẩn)</button>
            <button data-speed="1.25">1.25x</button>
            <button data-speed="1.5">1.5x</button>
            <button data-speed="2.0">2.0x</button>
          </div>
        </div>
        
        <!-- Center: Skip Back, Play/Pause, Skip Forward -->
        <div class="control-group center">
          <button id="btn-prev-para" class="player-btn secondary" title="Đoạn trước">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          
          <button id="btn-play-pause" class="player-btn primary main-play-btn" title="Phát/Tạm dừng">
            <i class="fa-solid fa-play"></i>
          </button>
          
          <button id="btn-next-para" class="player-btn secondary" title="Đoạn tiếp theo">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>
        
        <!-- Right Side: Auto-Advance & Quick Settings -->
        <div class="control-group right" style="gap: 6px;">
          <button id="btn-voice-switch" class="player-btn text-btn voice-btn" title="Đổi giọng đọc (Ngọc Linh / Thái Sơn)">
            <i class="fa-solid fa-microphone-lines" style="color: var(--accent-color);"></i>
            <span id="active-voice-label" style="margin-left: 3px;">Ngọc Linh</span>
          </button>
          
          <button id="btn-autoflip" class="player-btn text-btn voice-btn active" title="Tự động đọc và lật trang">
            <i class="fa-solid fa-circle-play" style="color: var(--accent-color);"></i>
            <span id="autoflip-label" style="margin-left: 3px;">Tự đọc: Bật</span>
          </button>
        </div>
        
      </div>
    </footer>
    
    <!-- Hidden HTML5 Audio Element -->
    <audio id="audio-player"></audio>
    
  </div>
  <script src="app.js"></script>
</body>
</html>
